<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠ Bildschirm nicht gesperrt!</title>
<style>
  :root {
    --red: #ff1a1a;
    --red-dark: #b30000;
    --bg: #0b0b0d;
    --text: #f5f5f5;
    --muted: #b8b8c0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 52px 16px;
  }

  /* Pulsierendes rotes Leuchten im Hintergrund */
  .glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255, 26, 26, .45) 0%, rgba(255, 26, 26, 0) 60%);
    animation: glow 1.2s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  /* Warnstreifen oben und unten */
  .stripes {
    position: fixed;
    left: 0; right: 0;
    height: 28px;
    background: repeating-linear-gradient(-45deg, var(--red) 0 24px, #111 24px 48px);
    background-size: 68px 100%;
    animation: stripes 1s linear infinite;
    z-index: 2;
  }
  .stripes.top { top: 0; }
  .stripes.bottom { bottom: 0; }

  /* Roter Blitz beim Laden */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--red);
    z-index: 10;
    pointer-events: none;
    animation: flash 1.4s ease-out forwards;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 760px;
    width: 100%;
  }

  .triangle {
    width: min(300px, 65vw, 32vh);
    height: auto;
    filter: drop-shadow(0 0 25px var(--red)) drop-shadow(0 0 60px var(--red));
    animation:
      dropIn .8s cubic-bezier(.2, 1.6, .4, 1) .3s both,
      pulse 1.2s ease-in-out 1.1s infinite,
      shake 4s ease-in-out 1.1s infinite;
    transform-origin: 50% 60%;
  }
  .triangle .mark { animation: blink 1.2s steps(1) 1.1s infinite; }

  h1 {
    margin-top: 18px;
    font-size: clamp(2rem, 7vw, 4.2rem);
    font-weight: 900;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--red);
    text-shadow: 0 0 12px var(--red), 0 0 40px var(--red-dark);
    animation: fadeUp .6s ease-out .9s both, flicker 3s linear 1.6s infinite;
  }

  .sub {
    margin-top: 10px;
    font-size: clamp(1.05rem, 3vw, 1.4rem);
    color: var(--muted);
    animation: fadeUp .6s ease-out 1.1s both;
  }

  .counter-box {
    margin: 32px auto 0;
    padding: 24px 20px;
    max-width: 460px;
    border: 3px solid var(--red);
    border-radius: 16px;
    background: rgba(20, 0, 0, .6);
    box-shadow: 0 0 30px rgba(255, 26, 26, .5), inset 0 0 30px rgba(255, 26, 26, .2);
    animation: fadeUp .6s ease-out 1.3s both;
  }
  .counter-label {
    font-size: .95rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--muted);
  }
  .counter {
    display: block;
    font-size: clamp(4rem, 18vw, 7.5rem);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 20px var(--red), 0 0 50px var(--red);
    font-variant-numeric: tabular-nums;
  }
  .counter.bump { animation: bump .5s ease-out; }
  .rank {
    margin-top: 6px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffd1d1;
  }
  .meta {
    margin-top: 12px;
    font-size: .85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .tip {
    margin-top: 28px;
    font-size: 1.05rem;
    color: var(--muted);
    animation: fadeUp .6s ease-out 1.5s both;
  }
  kbd {
    display: inline-block;
    padding: 3px 10px;
    margin: 2px;
    border: 2px solid #555;
    border-bottom-width: 4px;
    border-radius: 8px;
    background: #1b1b1f;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: .95rem;
  }

  @keyframes glow   { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes stripes { to { background-position: 68px 0; } }
  @keyframes flash  { 0% { opacity: 1; } 15% { opacity: 0; } 25% { opacity: .8; } 45% { opacity: 0; } 55% { opacity: .5; } 100% { opacity: 0; } }
  @keyframes dropIn { from { transform: scale(0) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes pulse  { 0%, 100% { filter: drop-shadow(0 0 20px var(--red)) drop-shadow(0 0 40px var(--red)); scale: 1; }
                      50% { filter: drop-shadow(0 0 45px var(--red)) drop-shadow(0 0 110px var(--red)); scale: 1.06; } }
  @keyframes shake  { 0%, 80%, 100% { rotate: 0deg; } 82% { rotate: -7deg; } 84% { rotate: 7deg; } 86% { rotate: -5deg; } 88% { rotate: 5deg; } 90% { rotate: 0deg; } }
  @keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .3; } 94% { opacity: 1; } 96% { opacity: .5; } 97% { opacity: 1; } }
  @keyframes bump   { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .flash { display: none; }
  }
</style>
</head>
<body>
  <div class="flash" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="stripes top" aria-hidden="true"></div>
  <div class="stripes bottom" aria-hidden="true"></div>

  <main>
    <svg class="triangle" viewBox="0 0 200 180" role="img" aria-label="Warndreieck">
      <path d="M100 10 L192 168 L8 168 Z"
            fill="#ff1a1a" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
      <path d="M100 38 L168 156 L32 156 Z" fill="#b30000"/>
      <g class="mark" fill="#fff">
        <rect x="91" y="68" width="18" height="52" rx="9"/>
        <circle cx="100" cy="138" r="10"/>
      </g>
    </svg>

    <h1>Bildschirm nicht gesperrt!</h1>
    <p class="sub">Du hast schon wieder vergessen, deinen Bildschirm zu sperren.</p>

    <section class="counter-box" aria-live="polite">
      <div class="counter-label">So oft hast du es vergessen</div>
      <span class="counter" id="counter">0</span>
      <div class="rank" id="rank"></div>
      <div class="meta" id="meta"></div>
    </section>

    <p class="tip">
      Beim nächsten Mal:
      <kbd>⊞ Win</kbd> + <kbd>L</kbd>
      &nbsp;oder Mac:&nbsp;
      <kbd>⌃ Ctrl</kbd> + <kbd>⌘ Cmd</kbd> + <kbd>Q</kbd>
    </p>
  </main>

<script>
(function () {
  var COOKIE = "screenlock_forgot";
  var MAX_AGE = 60 * 60 * 24 * 365 * 10; // 10 Jahre

  function readCookie(name) {
    var match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function writeCookie(name, value) {
    document.cookie = name + "=" + encodeURIComponent(value) +
      "; max-age=" + MAX_AGE + "; path=/; SameSite=Lax";
  }

  // Daten laden: Cookie zuerst, localStorage als Fallback (z. B. bei file://)
  function load() {
    var raw = readCookie(COOKIE);
    if (!raw) {
      try { raw = localStorage.getItem(COOKIE); } catch (e) {}
    }
    try {
      var data = JSON.parse(raw);
      if (data && typeof data.count === "number") return data;
    } catch (e) {}
    return { count: 0, first: null, last: null };
  }

  function save(data) {
    var json = JSON.stringify(data);
    writeCookie(COOKIE, json);
    try { localStorage.setItem(COOKIE, json); } catch (e) {}
  }

  function rankFor(n) {
    if (n === 1) return "Erstes Mal – das kann passieren. 😅";
    if (n <= 3)  return "Wiederholungstäter:in 🙈";
    if (n <= 5)  return "Gewohnheitsvergesser:in 🤦";
    if (n <= 10) return "Sicherheitsrisiko auf zwei Beinen 🚨";
    if (n <= 20) return "Die IT kennt dich schon beim Namen 👀";
    return "Legende der offenen Bildschirme 🏆";
  }

  function fmt(iso) {
    return new Date(iso).toLocaleString("de-DE", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  var data = load();
  var previousLast = data.last;
  var now = new Date().toISOString();

  data.count += 1;
  if (!data.first) data.first = now;
  data.last = now;
  save(data);

  var counterEl = document.getElementById("counter");
  var target = data.count;

  // Hochzähl-Animation
  function countUp() {
    var duration = Math.min(1500, 300 + target * 60);
    var start = performance.now();
    function step(t) {
      var p = Math.min(1, (t - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      counterEl.textContent = Math.round(eased * target);
      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        counterEl.classList.add("bump");
      }
    }
    requestAnimationFrame(step);
  }
  setTimeout(countUp, 1400);

  document.getElementById("rank").textContent = rankFor(target);

  var meta = "Zum ersten Mal erwischt: " + fmt(data.first);
  if (previousLast) meta += "<br>Davor zuletzt erwischt: " + fmt(previousLast);
  document.getElementById("meta").innerHTML = meta;
})();
</script>
</body>
</html>
